version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: stockvision_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-stockvision_db}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/analytical_views.sql:/docker-entrypoint-initdb.d/02_views.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stockvision_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: stockvision_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Streamlit Dashboard ────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      target: production
    container_name: stockvision_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

  # ── MLflow Tracking Server ────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: stockvision_mlflow
    restart: unless-stopped
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow && mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0 --port 5000"

volumes:
  postgres_data:
  mlflow_data:
